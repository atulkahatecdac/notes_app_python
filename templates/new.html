{% extends "base.html" %}
{% block title %}New Note{% endblock %}
{% block content %}
<h1>New note</h1>
<form method="post">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required autofocus placeholder="Give your note a title…">
    </div>
    <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" required placeholder="Start writing…"></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save note</button>
        <a href="{{ url_for('index') }}" class="btn btn-ghost">Cancel</a>
    </div>
</form>
{% endblock %}
