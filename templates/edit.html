{% extends "base.html" %}
{% block title %}Edit — {{ note.title }}{% endblock %}
{% block content %}
<h1>Edit note</h1>
<form method="post">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ note.title }}" required autofocus>
    </div>
    <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" required>{{ note.content }}</textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{{ url_for('view_note', note_id=note.id) }}" class="btn btn-ghost">Cancel</a>
    </div>
</form>
{% endblock %}
